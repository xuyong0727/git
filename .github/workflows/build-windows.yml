name: Build Windows exe

on:
  workflow_dispatch:
  push:
    branches:
      - ci/windows-build

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ensure config.ini exists
        run: |
          if (-not (Test-Path config.ini)) {
            "[System]" | Out-File -Encoding utf8 config.ini
            "person=admin" | Out-File -Append -Encoding utf8 config.ini
          }
      - name: Build exe with PyInstaller
        run: |
          if (Test-Path p.ico) {
            pyinstaller --clean --onefile --noconsole --icon=p.ico --add-data "config.ini;." scan_control.py
          } else {
            pyinstaller --clean --onefile --noconsole --add-data "config.ini;." scan_control.py
          }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan_control-win10-exe
          path: dist/scan_control.exe
